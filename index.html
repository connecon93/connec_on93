<!-- MODAL CONFIGURACIÓN REUNIÓN TEAMS -->
<div id="teams-modal" class="fixed inset-0 bg-[#413F3D]/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-md w-full overflow-hidden">
        <div class="bg-teams-purple text-white px-6 py-4 flex justify-between items-center">
            <h3 class="font-bold text-sm"><i class="fa-solid fa-video mr-2"></i> Configurar Sala de Crisis (Teams)</h3>
            <button id="btn-close-teams-modal" class="text-slate-200 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <form id="teams-config-form" class="p-6 space-y-4">
            <div>
                <label class="block text-xs font-bold text-corporate-gray uppercase mb-1">Invitados Requeridos (Emails)</label>
                <input type="text" id="invitados-requeridos" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-[#6264A7] focus:outline-none" placeholder="correo1@empresa.com; correo2@empresa.com">
            </div>
            <div>
                <label class="block text-xs font-bold text-corporate-gray uppercase mb-1">Invitados Opcionales (Emails)</label>
                <input type="text" id="invitados-opcionales" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-[#6264A7] focus:outline-none" placeholder="opcional@empresa.com">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-corporate-gray uppercase mb-1">Hora de Inicio</label>
                    <input type="datetime-local" id="hora-inicio" required class="w-full border border-slate-300 rounded-lg p-2 text-xs focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-corporate-gray uppercase mb-1">Hora de Fin</label>
                    <input type="datetime-local" id="hora-fin" required class="w-full border border-slate-300 rounded-lg p-2 text-xs focus:outline-none">
                </div>
            </div>
            <div class="flex justify-end space-x-3 pt-4 border-t border-slate-200">
                <button type="button" id="btn-cancel-teams-modal" class="bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm font-semibold">Cancelar</button>
                <button type="submit" class="bg-teams-purple hover:bg-[#51538f] text-white px-5 py-2 rounded-lg text-sm font-bold shadow">Generar Reunión</button>
            </div>
        </form>
    </div>
</div>
